name: Build PS3 PKG

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare PS3 Game Folder
        run: |
          mkdir -p PS3_GAME/USRDIR
          
          # Dosyalar ana dizindeyse USRDIR içine taşıyalım
          if [ -f "EBOOT.BIN" ]; then
            mv EBOOT.BIN PS3_GAME/USRDIR/
          fi
          
          # Assetleri ve görselleri doğru yerlerine taşıyalım
          mv *.png PS3_GAME/ 2>/dev/null || true
          mv *.jpg PS3_GAME/ 2>/dev/null || true
          mv *.ttf PS3_GAME/PS3_GAME/USRDIR/ 2>/dev/null || true
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true

          echo "Klasör yapısı hazır:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Install Make Package Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 wget unzip
          
          # Git clone yerine doğrudan zip olarak indiriyoruz (kimlik doğrulama hatası vermez)
          wget https://github.com/ESTDCU/make_package_npdrm/archive/refs/heads/master.zip
          unzip master.zip
          cd make_package_npdrm-master
          make
          sudo cp make_package_npdrm /usr/local/bin/

      - name: Build PKG File
        run: |
          # make_package_npdrm ile PKG dosyasını oluşturalım
          make_package_npdrm PS3_GAME/ KITTYRACER.pkg
          
          mkdir -p output_pkg
          mv KITTYRACER.pkg output_pkg/

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: output_pkg/*.pkg
          
