name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare PS3 Game Folder
        run: |
          mkdir -p PS3_GAME/USRDIR
          
          if [ -f "EBOOT.BIN" ]; then
            mv EBOOT.BIN PS3_GAME/USRDIR/
          fi
          
          mv *.png PS3_GAME/ 2>/dev/null || true
          mv *.jpg PS3_GAME/ 2>/dev/null || true
          mv *.ttf PS3_GAME/USRDIR/ 2>/dev/null || true
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true

          echo "Klasör yapısı hazır:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Install Dependencies and Build Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake libssl-dev zlib1g-dev libtool autoconf automake pkg-config
          
          # PS3Dev'in resmi ve güncel deposunu klonluyoruz
          git clone https://github.com/ps3dev/PSL1GHT.git
          cd PSL1GHT
          
          # İçindeki make_package_npdrm aracını derliyoruz
          cd tools/make_package_npdrm
          make
          
          # Sisteme kuralım
          sudo cp make_package_npdrm /usr/local/bin/

      - name: Build PKG File
        run: |
          # make_package_npdrm aracını kullanarak PKG oluşturuyoruz
          make_package_npdrm PS3_GAME/ KITTYRACER.pkg
          
          mkdir -p output_pkg
          mv KITTYRACER.pkg output_pkg/

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: output_pkg/*.pkg
