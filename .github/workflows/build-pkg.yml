name: Build PS3 PKG

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Organize PS3 Files
        run: |
          # Dosyalar ana dizindeyse onları otomatik olarak PS3_GAME yapısına taşıyalım
          mkdir -p PS3_GAME/USRDIR
          
          # EBOOT.BIN ve assetleri USRDIR içine taşı (eğer zaten USRDIR içindeyse atlar)
          if [ -d "USRDIR" ]; then
            echo "USRDIR zaten mevcut."
          else
            # Eğer dosyalar dağınıksa onları uygun yere taşıyoruz
            mv EBOOT.BIN PS3_GAME/USRDIR/ 2>/dev/null || true
            mv *.png PS3_GAME/ 2>/dev/null || true
            mv *.jpg PS3_GAME/ 2>/dev/null || true
            mv *.ttf PS3_GAME/PS3_GAME/USRDIR/ 2>/dev/null || true
          fi
          
          # PARAM.SFO dosyasını kök PS3_GAME klasörüne alalım
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true
          
          echo "Klasör yapısı son durum:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-Files
          path: |
            PS3_GAME/
            
