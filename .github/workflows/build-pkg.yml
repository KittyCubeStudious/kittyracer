name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Manuel olarak da çalıştırabilmek için ekledim

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare PS3 Game Folder
        run: |
          mkdir -p PS3_GAME/USRDIR
          
          # Dosyalar ana dizindeyse USRDIR içine taşıyalım
          if [ -f "EBOOT.BIN" ]; then
            mv EBOOT.BIN PS3_GAME/USRDIR/
          fi
          
          # Assetleri ve görselleri doğru yerlerine taşıyalım
          mv *.png PS3_GAME/ 2>/dev/null || true
          mv *.jpg PS3_GAME/ 2>/dev/null || true
          
          # Dizin hatası düzeltildi (PS3_GAME/PS3_GAME yerine sadece USRDIR)
          mv *.ttf PS3_GAME/USRDIR/ 2>/dev/null || true
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true

          echo "Klasör yapısı hazır:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Install pkgtool (make_package_npdrm alternatifi)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake libssl-dev zlib1g-dev
          
          # PS3Dev topluluğunun güncel pkgtool aracını indiriyoruz
          git clone https://github.com/ps3dev/pkgtool.git
          cd pkgtool
          
          # Derleme işlemi
          make
          
          # Sisteme kuralım
          sudo make install

      - name: Build PKG File
        run: |
          # pkgtool komutu ile PKG dosyasını oluşturalım
          # Not: pkgtool bazen farklı parametreler isteyebilir ama genelde bu şekilde çalışır
          pkgtool --sfo PS3_GAME/PARAM.SFO PS3_GAME/ KITTYRACER.pkg
          
          mkdir -p output_pkg
          mv KITTYRACER.pkg output_pkg/

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: output_pkg/*.pkg
