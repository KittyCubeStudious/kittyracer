name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare PS3 Game Folder
        run: |
          mkdir -p PS3_GAME/USRDIR
          
          if [ -f "EBOOT.BIN" ]; then
            mv EBOOT.BIN PS3_GAME/USRDIR/
          fi
          
          mv *.png PS3_GAME/ 2>/dev/null || true
          mv *.jpg PS3_GAME/ 2>/dev/null || true
          mv *.ttf PS3_GAME/USRDIR/ 2>/dev/null || true
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true

          echo "Klasör yapısı hazır:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Install pkgtool (Make Package Npdrm)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake libssl-dev zlib1g-dev libtool autoconf automake pkg-config
          
          # Kesin olarak var olan ve çalışan topluluk deposu
          git clone https://github.com/ps3dev/PS3-PKG-Tools.git
          cd PS3-PKG-Tools
          
          # Aracı derle
          make
          
          # Sisteme kur
          sudo cp pkgtool /usr/local/bin/ || sudo cp make_package_npdrm /usr/local/bin/ || true

      - name: Build PKG File
        run: |
          # Aracı çalıştır (pkgtool veya make_package_npdrm)
          if command -v pkgtool &> /dev/null; then
            pkgtool --sfo PS3_GAME/PARAM.SFO PS3_GAME/ KITTYRACER.pkg
          elif command -v make_package_npdrm &> /dev/null; then
            make_package_npdrm PS3_GAME/ KITTYRACER.pkg
          else
            echo "HATA: PKG oluşturma aracı derlenemedi."
            exit 1
          fi
          
          # PKG dosyası gerçekten oluştu mu ve içi dolu mu kontrol et
          if [ -f KITTYRACER.pkg ] && [ -s KITTYRACER.pkg ]; then
            echo "Başarılı! PKG dosyası oluşturuldu."
            mkdir -p output_pkg
            mv KITTYRACER.pkg output_pkg/
          else
            echo "HATA: PKG dosyası boş veya oluşmadı! Klasör yapısını kontrol edin."
            exit 1
          fi

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: output_pkg/*.pkg
          if-no-files-found: error # Boşsa hata versin, boş dosya yüklemesin
