name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare PS3 Game Folder
        run: |
          mkdir -p PS3_GAME/USRDIR
          
          if [ -f "EBOOT.BIN" ]; then
            mv EBOOT.BIN PS3_GAME/USRDIR/
          fi
          
          mv *.png PS3_GAME/ 2>/dev/null || true
          mv *.jpg PS3_GAME/ 2>/dev/null || true
          mv *.ttf PS3_GAME/USRDIR/ 2>/dev/null || true
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true

          echo "Klasör yapısı hazır:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Install ps3-pkg-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          
          # Güncel ve çalışan PS3 PKG aracını indiriyoruz
          git clone https://github.com/rmuxnet/ps3-pkg-tool.git
          cd ps3-pkg-tool
          
          # Gerekli Python kütüphanelerini kuruyoruz
          pip install -r requirements.txt || true

      - name: Build PKG File
        run: |
          # ps3-pkg-tool ile PKG dosyasını oluşturuyoruz
          # Bu araç, make_package_npdrm ile aynı işi yapar
          cd ps3-pkg-tool
          python3 ps3-pkg-tool.py --dir ../PS3_GAME --output ../KITTYRACER.pkg
          
          cd ..
          mkdir -p output_pkg
          mv KITTYRACER.pkg output_pkg/

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: output_pkg/*.pkg
