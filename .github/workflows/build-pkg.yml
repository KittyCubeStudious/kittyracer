name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare PS3 Game Folder
        run: |
          mkdir -p PS3_GAME/USRDIR
          
          if [ -f "EBOOT.BIN" ]; then
            mv EBOOT.BIN PS3_GAME/USRDIR/
          fi
          
          mv *.png PS3_GAME/ 2>/dev/null || true
          mv *.jpg PS3_GAME/ 2>/dev/null || true
          mv *.ttf PS3_GAME/USRDIR/ 2>/dev/null || true
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true

          echo "Klasör yapısı hazır:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Install Dependencies and ps3-pkg-tool
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip git
          
          # Python bağımlılıklarını kur (cryptography, pycryptodomex vs.)
          pip3 install cryptography pycryptodomex
          
          # Gerçek ve çalışan PS3 PKG aracını indir
          git clone https://github.com/rmuxnet/ps3-pkg-tool.git
          
          # İçine gir ve gerekli ayarları yap
          cd ps3-pkg-tool
          pip3 install -r requirements.txt || true

      - name: Build PKG File
        run: |
          # ps3-pkg-tool aracını çalıştır
          cd ps3-pkg-tool
          
          # Bu araç dosyaları paketlemek için farklı bir komut isteyebilir
          # Klasörü ve çıktı dosyasını belirtiyoruz
          python3 ps3-pkg-tool.py --dir ../PS3_GAME --output ../KITTYRACER.pkg || \
          python3 pkg.py --dir ../PS3_GAME --output ../KITTYRACER.pkg || \
          echo "Araç farklı bir komut bekliyor olabilir, logları kontrol et."
          
          cd ..
          mkdir -p output_pkg
          mv KITTYRACER.pkg output_pkg/ 2>/dev/null || echo "PKG dosyası oluşmadı!"

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: output_pkg/*.pkg
          if-no-files-found: warn
