name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare PS3 Game Folder
        run: |
          mkdir -p PS3_GAME/USRDIR
          
          if [ -f "EBOOT.BIN" ]; then
            mv EBOOT.BIN PS3_GAME/USRDIR/
          fi
          
          mv *.png PS3_GAME/ 2>/dev/null || true
          mv *.jpg PS3_GAME/ 2>/dev/null || true
          mv *.ttf PS3_GAME/USRDIR/ 2>/dev/null || true
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true

          echo "Klasör yapısı hazır:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Install Dependencies and Build Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git cmake libssl-dev zlib1g-dev libtool autoconf automake pkg-config
          
          # PSL1GHT deposunu klonluyoruz (Bu depo kesinlikle var)
          git clone --depth 1 https://github.com/ps3dev/PSL1GHT.git
          cd PSL1GHT
          
          # Aracın nerede olduğunu otomatik bulalım
          echo "Araç aranıyor..."
          find . -name "make_package_npdrm*" -type f
          find . -name "pkgtool*" -type f
          
          # Genelde tools/ altında olur, oraya gidip derleyelim
          if [ -d "tools/make_package_npdrm" ]; then
            cd tools/make_package_npdrm
            make
            sudo cp make_package_npdrm /usr/local/bin/
          elif [ -d "tools/pkgtool" ]; then
            cd tools/pkgtool
            make
            sudo cp pkgtool /usr/local/bin/
          else
            # Eğer tools altında yoksa tüm projeyi derleyelim (biraz uzun sürer ama garanti)
            make
            sudo make install
          fi

      - name: Build PKG File
        run: |
          # Hangi araç kurulduysa onu kullan
          if command -v make_package_npdrm &> /dev/null; then
            make_package_npdrm PS3_GAME/ KITTYRACER.pkg
          elif command -v pkgtool &> /dev/null; then
            pkgtool PS3_GAME/ KITTYRACER.pkg
          else
            # Son çare olarak pkg_custom kullan
            echo "Araç bulunamadı, alternatif aranıyor..."
            exit 1
          fi
          
          mkdir -p output_pkg
          mv KITTYRACER.pkg output_pkg/

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: output_pkg/*.pkg
