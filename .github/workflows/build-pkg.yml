name: Build PS3 PKG

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare PS3 Game Folder
        run: |
          # Klasör yapısını tam garantiye alalım
          mkdir -p PS3_GAME/USRDIR
          
          # Eğer dosyalar ana dizindeyse USRDIR içine taşıyalım
          if [ -f "EBOOT.BIN" ]; then
            mv EBOOT.BIN PS3_GAME/USRDIR/
          fi
          
          # Assetleri ve görselleri taşı
          mv *.png PS3_GAME/ 2>/dev/null || true
          mv *.jpg PS3_GAME/ 2>/dev/null || true
          mv *.ttf PS3_GAME/PS3_GAME/USRDIR/ 2>/dev/null || true
          mv PARAM.SFO PS3_GAME/ 2>/dev/null || true

          echo "Klasör yapısı hazır:"
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

      - name: Install Make Package Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential python3
          
          # PS3 paketleme aracını (make_package_npdrm) klonlayıp derleyelim
          git clone https://github.com/Tustin/make_package_npdrm.git
          cd make_package_npdrm
          make
          sudo cp make_package_npdrm /usr/local/bin/

      - name: Build PKG File
        run: |
          # make_package_npdrm kullanarak .pkg dosyasını üretelim
          # İçerik klasörünü ve output dosyasını belirtiyoruz
          make_package_npdrm PS3_GAME/ KITTYRANCER.pkg
          
          mkdir -p output_pkg
          mv KITTYRANCER.pkg output_pkg/

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: output_pkg/*.pkg
          
