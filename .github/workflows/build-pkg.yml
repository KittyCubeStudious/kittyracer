name: Build PS3 PKG

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install PKG Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 make build-essential

          # PS3 PKG araçlarını (make_package_npdrm vb.) içeren güvenli bir araç seti indiriyoruz
          git clone https://github.com/nielseroberts/ps3tools.git || git clone https://github.com/Tustin/make_package_npdrm.git || true
          
          # Alternatif olarak Python tabanlı hafif bir pkg oluşturucu da kullanabiliriz
          # Şimdi repodaki PS3_GAME klasörünü paketleyeceğiz.

      - name: Package to PS3 PKG
        run: |
          echo "PS3_GAME klasörü kontrol ediliyor..."
          ls -la PS3_GAME/
          ls -la PS3_GAME/USRDIR/

          # Eğer sistemde make_package yoksa bile Python ile zip/pkg yapısını simüle edebilir 
          # veya standart make_package_npdrm aracını derleyip çalıştırabiliriz.
          # Şimdilik çıktının nerede olacağını ayarlıyoruz:
          mkdir -p output
          
          # Geçici olarak test paketi oluşturalım:
          echo "Kitty Racer PKG oluşturma aşaması"

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KittyRacer-PS3-PKG
          path: |
            PS3_GAME/
            
